name: SoilDrought-CalculateIndicators

on:
  workflow_dispatch:
    inputs:
      root_zone_depth_in:
        description: "Approved crop rooting depth in inches. Leave blank to calculate layer-level indicators only."
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/SoilDrought-CalculateIndicators.yml"
      - "scripts/run_drought_indicators.py"

jobs:
  calculate-drought-indicators:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas numpy

      - name: Calculate drought indicators from Action 7 VWC and SSURGO
        env:
          S3PRIVATE_AccessKey: ${{ secrets.S3PRIVATE_AccessKey }}
          S3PRIVATE_SecretKey: ${{ secrets.S3PRIVATE_SecretKey }}
          SOIL_BUCKET: faasr-bucket-smarttap-private
          SOIL_BUCKET_REGION: us-east-1
          ACTION7_KEY: soil_sensor_processing/bias_correction/soil_moisture_bias_corrected.csv
          SSURGO_KEY: soil_sensor_processing/ssurgo/ssurgo_site_depth_hydraulic_properties.csv
          DROUGHT_OUTPUT_PREFIX: soil_sensor_processing/drought_alerts
          LOCAL_ARTIFACT_DIR: artifacts/drought
          ROOT_ZONE_DEPTH_IN: ${{ inputs.root_zone_depth_in }}
        run: |
          python scripts/run_drought_indicators.py

      - name: Upload drought outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soil-moisture-drought-indicators
          path: artifacts/drought/
          if-no-files-found: warn
