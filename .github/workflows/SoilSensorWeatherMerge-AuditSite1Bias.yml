name: SoilSensorWeatherMerge-AuditSite1Bias

on:
  push:
    paths:
      - ".github/workflows/SoilSensorWeatherMerge-AuditSite1Bias.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit Site 1 stage transitions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3PRIVATE_AccessKey }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3PRIVATE_SecretKey }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/staging/sensor_observations_standardized.csv /tmp/original.csv
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/outlier_detection/soil_moisture_outlier_flagged.csv /tmp/action6.csv
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/bias_correction/soil_moisture_bias_corrected.csv /tmp/action7.csv
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/bias_correction/soil_moisture_bias_sensor_summary.csv /tmp/summary.csv
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/final/final_soil_moisture_csv.csv /tmp/action8.csv

          python3 - <<'PY'
          import csv
          import json
          import math
          import statistics
          from collections import Counter, defaultdict

          def read(path):
              with open(path, newline="") as handle:
                  return list(csv.DictReader(handle))

          def site1(rows):
              return [row for row in rows if int(float(row["site_id"])) == 1]

          def finite(row, column):
              try:
                  value = float(row[column])
              except (KeyError, TypeError, ValueError):
                  return None
              return value if math.isfinite(value) else None

          def stats(values):
              values = [value for value in values if value is not None]
              return {
                  "n": len(values),
                  "min": min(values) if values else None,
                  "mean": statistics.fmean(values) if values else None,
                  "median": statistics.median(values) if values else None,
                  "max": max(values) if values else None,
              }

          def corr(x, y):
              pairs = [(a, b) for a, b in zip(x, y) if a is not None and b is not None]
              if len(pairs) < 3:
                  return None
              xs, ys = zip(*pairs)
              mx, my = statistics.fmean(xs), statistics.fmean(ys)
              numerator = sum((a - mx) * (b - my) for a, b in pairs)
              denominator = math.sqrt(
                  sum((a - mx) ** 2 for a in xs) * sum((b - my) ** 2 for b in ys)
              )
              return numerator / denominator if denominator else None

          original = site1(read("/tmp/original.csv"))
          action6 = site1(read("/tmp/action6.csv"))
          action7 = site1(read("/tmp/action7.csv"))
          action8 = site1(read("/tmp/action8.csv"))
          summary = site1(read("/tmp/summary.csv"))

          original_by_depth = defaultdict(list)
          for row in original:
              original_by_depth[float(row["depth_in"])].append(row)
          six_by_depth = defaultdict(list)
          for row in action6:
              six_by_depth[float(row["depth_in"])].append(row)
          seven_by_depth = defaultdict(list)
          for row in action7:
              seven_by_depth[float(row["depth_in"])].append(row)
          eight_by_depth = defaultdict(list)
          for row in action8:
              eight_by_depth[float(row["depth_in"])].append(row)

          for depth in sorted(set(six_by_depth) | set(seven_by_depth)):
              rows6 = sorted(six_by_depth[depth], key=lambda row: row["date"])
              rows7 = sorted(seven_by_depth[depth], key=lambda row: row["date"])
              rows8 = sorted(eight_by_depth[depth], key=lambda row: row["date"])
              before = [finite(row, "vwc_cm3_cm3") for row in rows7]
              corrected = [finite(row, "vwc_bias_corrected_cm3_cm3") for row in rows7]
              reference = [finite(row, "reference_vwc_cm3_cm3") for row in rows7]
              deltas = [
                  after - prior
                  for prior, after in zip(before, corrected)
                  if prior is not None and after is not None
              ]
              final = [finite(row, "vwc_final_cm3_cm3") for row in rows8]
              final_delta = [
                  after - prior
                  for prior, after in zip(corrected, final)
                  if prior is not None and after is not None
              ]
              record = {
                  "depth_in": depth,
                  "raw_original": stats(
                      [finite(row, "vwc_cm3_cm3") for row in original_by_depth[depth]]
                  ),
                  "action6_input_to_bias": stats(
                      [finite(row, "vwc_cm3_cm3") for row in rows6]
                  ),
                  "reference": stats(reference),
                  "bias_corrected": stats(corrected),
                  "bias_delta": stats(deltas),
                  "final": stats(final),
                  "smoothing_delta": stats(final_delta),
                  "sensor_reference_correlation": corr(before, reference),
                  "corrected_rows": sum(
                      row.get("bias_correction_applied", "").lower() == "true"
                      for row in rows7
                  ),
                  "outlier_rows": sum(
                      int(float(row.get("outlier_method_count") or 0)) > 0
                      for row in rows7
                  ),
                  "correction_methods": dict(Counter(
                      row.get("bias_correction_method", "")
                      for row in rows7
                  )),
              }
              print("SITE1_DEPTH_AUDIT", json.dumps(record, sort_keys=True))

          fields = [
              "depth_in",
              "reference_dataset",
              "reference_variable",
              "paired_reference_rows",
              "reliable_training_pairs",
              "median_sensor_minus_reference_before_cm3_cm3",
              "same_direction_residual_share",
              "systematic_bias_detected",
              "selected_correction_method",
              "selected_model_parameters",
              "baseline_cv_rmse",
              "selected_cv_rmse",
              "cv_improvement_fraction",
              "extreme_outlier_reference_disagreements",
              "corrected_rows",
              "corrected_outlier_rows",
              "paired_rmse_before",
              "paired_rmse_after",
          ]
          for row in summary:
              print("SITE1_MODEL_DECISION", json.dumps(
                  {field: row.get(field) for field in fields},
                  sort_keys=True,
              ))
          PY
