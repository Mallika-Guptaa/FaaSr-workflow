name: SoilSensorWeatherMerge-AuditSiteArtifacts

on:
  push:
    paths:
      - ".github/workflows/SoilSensorWeatherMerge-AuditSiteArtifacts.yml"

jobs:
  audit-site-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 client
        run: pip install boto3

      - name: Verify site folders and summaries
        env:
          AWS_AccessKey: ${{ secrets.AWS_AccessKey }}
          AWS_SecretKey: ${{ secrets.AWS_SecretKey }}
        run: |
          python - <<'PY'
          import json
          import os

          import boto3

          bucket = "faasr-bucket-smarttap-private"
          root = "soil_sensor_processing/sites"
          s3 = boto3.client(
              "s3",
              region_name="us-east-1",
              aws_access_key_id=os.environ["AWS_AccessKey"],
              aws_secret_access_key=os.environ["AWS_SecretKey"],
          )

          for site_id in range(1, 5):
              site_prefix = f"{root}/site_{site_id}"
              response = s3.list_objects_v2(
                  Bucket=bucket,
                  Prefix=f"{site_prefix}/plots/",
              )
              plot_keys = sorted(
                  item["Key"]
                  for item in response.get("Contents", [])
                  if item["Key"].endswith(".png")
              )
              expected = [
                  f"{site_prefix}/plots/{action:02d}_{stem}_site_{site_id}.png"
                  for action, stem in (
                      (1, "load_soil_inputs_comparison"),
                      (2, "weather_download_comparison"),
                      (3, "sensor_malfunction_qc_comparison"),
                      (4, "weather_merge_comparison"),
                      (5, "gap_reconstruction_comparison"),
                      (6, "outlier_detection_comparison"),
                      (7, "bias_correction_comparison"),
                      (8, "temporal_smoothing_comparison"),
                  )
              ]
              assert plot_keys == expected, (site_id, plot_keys)

              summary_key = f"{site_prefix}/final_site_summary.json"
              body = s3.get_object(Bucket=bucket, Key=summary_key)["Body"].read()
              summary = json.loads(body)
              assert summary["site"]["site_id"] == site_id
              assert len(summary["plots"]) == 8
              assert len(summary["processing"]) == 8
              assert summary["final_quality"]["missing_values"] == 0
              assert summary["final_quality"]["values_outside_0_1"] == 0

              bias = summary["processing"]["action_7_bias_correction"]
              smoothing = summary["processing"]["action_8_smoothing_and_validation"]
              print(json.dumps({
                  "site_id": site_id,
                  "plot_count": len(plot_keys),
                  "summary_bytes": len(body),
                  "processing_actions": sorted(summary["processing"]),
                  "final_quality": summary["final_quality"],
                  "bias_reference_datasets": bias["reference_datasets"],
                  "bias_corrected_rows": bias["corrected_rows"],
                  "validation_depths": len(smoothing["held_out_validation_by_depth"]),
                  "physical_check_depths": len(smoothing["physical_consistency_by_depth"]),
              }, sort_keys=True))
          PY
