name: SoilSensorWeatherMerge-InspectBiasManifest

on:
  push:
    paths:
      - ".github/workflows/SoilSensorWeatherMerge-InspectBiasManifest.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect completed bias and final outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3PRIVATE_AccessKey }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3PRIVATE_SecretKey }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "BIAS MANIFEST"
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/bias_correction/bias_correction_manifest.json - |
          jq '{
            input_rows,
            output_rows,
            rows_deleted,
            row_keys_preserved,
            original_vwc_column_preserved,
            reference_rows_available,
            reference_coverage_fraction,
            systematically_biased_sensor_series,
            extreme_outlier_reference_disagreements,
            corrected_rows,
            corrected_outlier_rows,
            correction_counts_by_method,
            paired_rmse_before,
            paired_rmse_after,
            reference_selection
          }'

          echo "FINAL MANIFEST"
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/final/final_processing_manifest.json - |
          jq '{
            input_source,
            bias_corrected_input_used,
            input_rows,
            output_rows,
            rows_deleted,
            row_keys_preserved,
            missing_final_values,
            final_values_outside_0_1,
            maximum_absolute_smoothing_adjustment_cm3_cm3,
            selected_sensor_series_by_method,
            held_out_validation_metrics,
            held_out_rmse_improvement_vs_baseline_fraction,
            physical_consistency
          }'

          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/final/final_soil_moisture_csv.csv /tmp/final.csv
          aws s3 cp s3://faasr-bucket-smarttap-private/soil_sensor_processing/bias_correction/soil_moisture_reference_daily_by_site.csv /tmp/reference.csv
          python3 - <<'PY'
          import csv
          import math

          with open("/tmp/final.csv", newline="") as handle:
              final = list(csv.DictReader(handle))
          keys = [(row["site_id"], row["date"], row["depth_in"]) for row in final]
          values = [float(row["vwc_final_cm3_cm3"]) for row in final]
          print("FINAL CSV CHECK", {
              "rows": len(final),
              "unique_keys": len(set(keys)),
              "sites": sorted({row["site_id"] for row in final}),
              "date_min": min(row["date"] for row in final),
              "date_max": max(row["date"] for row in final),
              "final_vwc_min": min(values),
              "final_vwc_max": max(values),
              "nonfinite_final_values": sum(not math.isfinite(value) for value in values),
          })

          with open("/tmp/reference.csv", newline="") as handle:
              reference = list(csv.DictReader(handle))
          print("REFERENCE CSV CHECK", {
              "rows": len(reference),
              "datasets": sorted({row["reference_dataset"] for row in reference}),
              "sites": sorted({row["site_id"] for row in reference}),
              "date_min": min(row["date"] for row in reference),
              "date_max": max(row["date"] for row in reference),
              "variables": sorted({row["reference_variable"] for row in reference}),
          })
          PY
